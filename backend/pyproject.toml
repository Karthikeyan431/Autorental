[project]
name = "arms-backend"
version = "0.1.0"
description = "Auto Rental Management System API"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit security checks
  "SIM",           # simplifications
  "RUF",           # ruff-specific
  "DTZ",           # no naive datetimes
  "T20",           # no print() outside the CLI
]

[tool.ruff.lint.isort]
# backend/alembic/ is the migrations folder; the `alembic` import is always the installed package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"app/cli/**" = ["T201"]
"app/jobs/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# backend/alembic/ (migrations) is not listed: its folder name would shadow the installed package.
files = ["app", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# qrcode ships no type hints; adding types-qrcode would be a new dependency. Only
# app/modules/auth/service.py uses it (TOTP setup QR as SVG).
module = ["qrcode", "qrcode.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# reportlab (agreement PDF, app/modules/agreements/pdf.py) and APScheduler 3 (development
# scheduler, app/core/scheduler.py) ship no type hints; stub packages would be new dependencies.
module = ["reportlab", "reportlab.*", "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
